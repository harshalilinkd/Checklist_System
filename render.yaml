services:
  # ---------------------------------------------------------------------------
  # Backend — Node/Express API
  # ---------------------------------------------------------------------------
  - type: web
    name: checklist-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend — static site (no build step)
  # ---------------------------------------------------------------------------
  - type: web
    name: checklist-frontend
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
